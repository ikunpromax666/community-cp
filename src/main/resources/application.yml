server:
  port: 8080

spring:
  application:
    name: community-cp

  # ===== 数据源配置 =====
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/community_cp?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: syf1017539550

  # ===== Redis 配置 =====
  data:
    redis:
      host: localhost
      port: 6379
      password:
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 3000ms

  # ===== 文件上传配置 =====
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

  # ===== Jackson 配置 =====
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# ===== MyBatis-Plus 配置 =====
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.community.communitycp.**.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 雪花算法主键
      id-type: assign_id
      # 逻辑删除
      logic-delete-field: is_deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ===== 项目自定义配置 =====
community:
  # JWT 配置
  jwt:
    secret: community-cp-secret-key-2026-must-be-at-least-256-bits-long
    # Token 有效期：20 小时（毫秒）
    expire: 72000000
    # 请求头名称
    header: Authorization
    # Token 前缀
    prefix: "Bearer "

  # ===== 文件上传配置 =====
  upload:
    path: D:/code/community-cp/uploads
    url-prefix: /uploads

# ===== 日志配置 =====
logging:
  level:
    com.community.communitycp: debug
    org.springframework.web: info
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] [%X{traceId}] %-5level %logger{36} - %msg%n"
